<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoja del juego · Escribe como una IA</title>
<style>
  @page{size:letter landscape;margin:0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito','Segoe UI',Arial,sans-serif;color:#1E2A3A;background:#fff;}
  .hoja{width:11in;height:8.5in;padding:.55in .7in;display:flex;flex-direction:column;}
  .arriba{display:flex;justify-content:space-between;align-items:flex-end;gap:.4in;}
  .eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:9.5pt;color:#5B6676;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:28pt;margin:.1in 0 0;line-height:1.1;}
  .linea{width:1.1in;height:.09in;background:#FFD60A;border-radius:4px;margin:.1in 0 0;}
  .equipo{font-size:13pt;font-weight:800;white-space:nowrap;padding-bottom:.08in;}
  .equipo span{display:inline-block;width:3in;border-bottom:2px solid #1E2A3A;}
  .reglas{display:flex;gap:.2in;margin:.28in 0 .3in;}
  .regla{flex:1;border:2px solid #E6DECF;border-radius:14px;padding:.12in .16in;font-size:11.5pt;line-height:1.3;display:flex;align-items:center;gap:.12in;}
  .regla b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:.34in;height:.34in;border-radius:50%;background:#FFD60A;font-family:Georgia,serif;font-size:13pt;}
  /* parrafo: la frase y una linea por palabra */
  .parrafo{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.62in .16in;padding-top:.2in;}
  .inicio{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:24pt;line-height:.42in;height:.42in;}
  .palabra{width:1.46in;height:.42in;border-bottom:2px solid #1E2A3A;}
  .pie{font-size:9.5pt;color:#5B6676;border-top:2px solid #E6DECF;padding-top:.1in;margin-top:.15in;display:flex;justify-content:space-between;}
</style>
</head>
<body>
<div class="hoja">
  <div class="arriba">
    <div>
      <div class="eyebrow">IA para la escuela · Sesión 1 · Paso 2</div>
      <h1>Escribe como una IA</h1>
      <div class="linea"></div>
    </div>
    <div class="equipo">Equipo: <span></span></div>
  </div>

  <div class="reglas">
    <div class="regla"><b>1</b><span>Escribe <strong>una sola palabra</strong> y pasa la hoja.</span></div>
    <div class="regla"><b>2</b><span>Lee <strong>todo lo que ya está escrito</strong>. Sin hablar.</span></div>
    <div class="regla"><b>3</b><span>La hoja da <strong>tres vueltas</strong> al equipo.</span></div>
  </div>

  <div class="parrafo">
    <span class="inicio">El agua hierve a</span>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
    <div class="palabra"></div>
  </div>

  <div class="pie"><span>Al terminar, un integrante lee la frase completa en voz alta.</span><span>Ing. Juan Pablo Rojas</span></div>
</div>
</body>
</html>
