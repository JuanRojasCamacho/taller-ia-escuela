<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Línea del tiempo de la Independencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Composición: papel picado arriba, riel de fechas, escenario (ilustración + texto) y botones abajo, todo en una pantalla */
:root{
  --verde:#0d3b33; --verde-hondo:#072620; --verde-vivo:#2f9e6a;
  --rojo:#c8102e; --oro:#f2b42d; --tinta:#16231f; --blanco:#fbfaf5;
  --display:'Alfa Slab One',Georgia,serif;
  --cuerpo:'Nunito','Segoe UI',system-ui,sans-serif;
  --dot:clamp(22px,3.6vh,40px);
  color-scheme:dark;
}
@property --c1{syntax:'<color>';inherits:true;initial-value:#fff0b8}
@property --c2{syntax:'<color>';inherits:true;initial-value:#f2b42d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 20% 0%,#14594b 0%,var(--verde) 45%,var(--verde-hondo) 100%);
  color:#fff;font-family:var(--cuerpo);
}
.picado{flex:none;display:block;width:100%;height:clamp(20px,3.4vh,36px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#app{
  flex:1;min-height:0;display:grid;grid-template-rows:auto auto 1fr auto;
  gap:clamp(8px,1.6vh,22px);
  padding:clamp(8px,1.4vh,18px) clamp(16px,2.4vw,48px) clamp(12px,2vh,28px);
}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,4.2vh,54px);line-height:1.05;text-wrap:balance;text-shadow:0 4px 0 rgba(0,0,0,.35)}
h1 span{color:var(--oro)}
#contador{
  flex:none;font-weight:900;font-size:clamp(16px,2.8vh,34px);padding:.3em .9em;border-radius:999px;
  background:rgba(255,255,255,.12);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 8px 16px rgba(0,0,0,.3);
  font-variant-numeric:tabular-nums;
}
/* Riel de fechas */
#rail{position:relative;padding:0 0 2px}
#track{position:absolute;left:calc(100%/18);right:calc(100%/18);top:calc(var(--dot)/2 - 4px);height:8px;border-radius:8px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
#fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--verde-vivo),var(--oro));box-shadow:0 0 14px rgba(242,180,45,.7);transition:width .6s cubic-bezier(.3,.8,.3,1)}
#nodes{position:relative;display:grid;grid-template-columns:repeat(9,1fr)}
.node{
  all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.3em;
  padding-bottom:4px;font-weight:800;line-height:1.05;text-align:center;
}
.dot{
  width:var(--dot);height:var(--dot);border-radius:50%;background:#e9efe9;border:4px solid #0a2a25;
  box-shadow:0 6px 10px rgba(0,0,0,.45),inset 0 -4px 6px rgba(0,0,0,.18);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s;
}
.node .d{font-size:clamp(14px,2.3vh,28px);color:#cfe3da;transition:color .3s}
.node .y{font-size:clamp(12px,1.9vh,22px);color:#8fb3a5;font-variant-numeric:tabular-nums}
.node:hover .dot{transform:scale(1.35) translateY(-3px)}
.node:active .dot{transform:scale(.9)}
.node.pasado .dot{background:var(--verde-vivo)}
.node.activo .dot{background:var(--oro);transform:scale(1.55);animation:anillo 1.8s ease-out infinite}
.node.activo:hover .dot{transform:scale(1.65)}
.node.activo .d{color:var(--oro);font-size:clamp(16px,2.8vh,34px)}
.node.activo .y{color:#fff}
.node:focus-visible .dot{outline:4px solid #fff;outline-offset:3px}
@keyframes anillo{0%{box-shadow:0 0 0 0 rgba(242,180,45,.7),0 6px 10px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 16px rgba(242,180,45,0),0 6px 10px rgba(0,0,0,.45)}}
/* Escenario */
#stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(14px,2vw,36px);min-height:0;perspective:1400px}
.card{
  position:relative;min-height:0;border-radius:28px;overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 34px 50px -24px rgba(0,0,0,.75),0 14px 22px -10px rgba(0,0,0,.5);
}
#artCard{background:radial-gradient(80% 70% at 50% 35%,var(--c1),var(--c2) 100%);transition:--c1 .7s,--c2 .7s}
#artCard::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 -30px 50px rgba(0,0,0,.18),inset 0 0 0 4px rgba(255,255,255,.18)}
.art{position:absolute;inset:3%;width:94%;height:94%;opacity:0;visibility:hidden;filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}
.art.on{opacity:1;visibility:visible;animation:pop .7s cubic-bezier(.3,1.5,.5,1)}
.art:not(.on) *{animation-play-state:paused}
@keyframes pop{from{transform:scale(.82) rotate(-2deg)}to{transform:none}}
#textCard{
  background:linear-gradient(160deg,#fff 0%,var(--blanco) 55%,#ece9dc 100%);color:var(--tinta);
  padding:clamp(18px,3.2vh,46px) clamp(20px,2.6vw,52px);display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.8vh,26px);
}
#textCard::before{content:"";position:absolute;left:0;right:0;top:0;height:clamp(8px,1.3vh,14px);background:linear-gradient(90deg,var(--verde-vivo) 0 33.3%,#fff 33.3% 66.6%,var(--rojo) 66.6%);box-shadow:0 3px 6px rgba(0,0,0,.25)}
#fecha{font-family:var(--display);font-size:clamp(30px,6.6vh,88px);line-height:1.02;color:var(--rojo);text-shadow:0 3px 0 rgba(200,16,46,.16);text-wrap:balance}
#titulo{font-weight:900;font-size:clamp(24px,4.4vh,58px);line-height:1.08;color:var(--verde);text-wrap:balance}
.dato{display:flex;flex-direction:column;gap:.3em}
.chip{align-self:flex-start;background:var(--verde);color:#fff;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(12px,1.9vh,24px);padding:.2em .8em;border-radius:999px;box-shadow:0 4px 0 #04150f}
.dato.quien .chip{background:var(--rojo);box-shadow:0 4px 0 #6d0618}
.dato p{font-weight:700;font-size:clamp(17px,3.3vh,44px);line-height:1.22}
/* Botones */
#controles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
#controles .ayuda{text-align:center;font-weight:800;font-size:clamp(13px,2.1vh,26px);color:#a9cbbd}
.btn{
  all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;
  font-family:var(--cuerpo);font-weight:900;font-size:clamp(18px,3.4vh,42px);
  padding:.45em 1.1em;border-radius:999px;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,opacity .2s,filter .2s;
}
#prev{justify-self:start;color:#3a2600;background:linear-gradient(180deg,#ffd66b,var(--oro) 55%,#d9962a);box-shadow:0 8px 0 #9a6a14,0 18px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.55)}
#next{justify-self:end;color:#fff;background:linear-gradient(180deg,#ee3a55,var(--rojo) 55%,#9b0b24);box-shadow:0 8px 0 #66051a,0 18px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.btn:hover{transform:translateY(-5px) scale(1.05);filter:brightness(1.08)}
#prev:hover{box-shadow:0 13px 0 #9a6a14,0 26px 34px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.55)}
#next:hover{box-shadow:0 13px 0 #66051a,0 26px 34px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(6px) scale(.96);filter:brightness(.95)}
#prev:active{box-shadow:0 2px 0 #9a6a14,0 5px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
#next:active{box-shadow:0 2px 0 #66051a,0 5px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.btn .fl{display:inline-block;transition:transform .2s}
#prev:hover .fl{transform:translateX(-8px)}
#next:hover .fl{transform:translateX(8px)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.btn[disabled]{opacity:.35;cursor:not-allowed;filter:grayscale(.5);transform:none;box-shadow:0 4px 0 rgba(0,0,0,.4)}
/* Movimiento dentro de las ilustraciones */
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.2s ease-in-out infinite}
.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .9s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0 50%;animation:wave 2.2s ease-in-out infinite}
.bob{animation:bob 3.4s ease-in-out infinite}
.recoil{animation:recoil 2.6s ease-out infinite}
.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 2.6s ease-out infinite}
.burst{transform-box:fill-box;transform-origin:50% 50%;animation:burst 2.4s ease-out infinite}
.ondas{animation:ondas 1.6s ease-out infinite}
@keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes flicker{0%,100%{transform:scale(1,1)}25%{transform:scale(.9,1.1)}50%{transform:scale(1.07,.93)}75%{transform:scale(.95,1.06)}}
@keyframes wave{0%,100%{transform:skewY(-3deg) scaleX(1)}50%{transform:skewY(3deg) scaleX(.97)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes recoil{0%{transform:translateX(0)}8%{transform:translateX(-14px)}40%,100%{transform:translateX(0)}}
@keyframes puff{0%,6%{transform:scale(.3);opacity:0}15%{opacity:.95}100%{transform:translate(24px,-34px) scale(1.5);opacity:0}}
@keyframes burst{0%{transform:scale(.2);opacity:0}20%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes ondas{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
@media (max-aspect-ratio:1/1){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr 1.3fr}
  #controles .ayuda{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<svg class="picado" viewBox="0 0 1200 34" preserveAspectRatio="none" aria-hidden="true">
  <defs><pattern id="pp" width="120" height="34" patternUnits="userSpaceOnUse">
    <polygon points="2,0 38,0 20,30" fill="#2f9e6a"/><polygon points="42,0 78,0 60,30" fill="#fbfaf5"/><polygon points="82,0 118,0 100,30" fill="#c8102e"/>
  </pattern></defs>
  <rect width="1200" height="3" fill="#f2b42d"/><rect y="3" width="1200" height="31" fill="url(#pp)"/>
</svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58f"/><stop offset=".5" stop-color="#e8b030"/><stop offset="1" stop-color="#9a6a14"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ee3a55"/><stop offset="1" stop-color="#8f0a21"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#47c48a"/><stop offset="1" stop-color="#0f6048"/></linearGradient>
  <linearGradient id="gStone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#8a7d6a"/></linearGradient>
  <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5f63"/><stop offset="1" stop-color="#15181a"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a47"/><stop offset="1" stop-color="#6a3d14"/></linearGradient>
  <linearGradient id="gPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e6d9b8"/></linearGradient>
  <radialGradient id="gGlow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="app">
  <header>
    <h1>La Independencia de México <span>1810–1821</span></h1>
    <div id="contador" aria-live="polite"></div>
  </header>
  <nav id="rail" aria-label="Línea del tiempo">
    <div id="track"><div id="fill"></div></div>
    <div id="nodes"></div>
  </nav>
  <main id="stage">
    <section class="card" id="artCard" aria-hidden="true">
      <!-- 1. Grito de Dolores: campana -->
      <svg class="art" viewBox="0 0 400 320" data-i="0">
        <ellipse cx="200" cy="300" rx="140" ry="12" fill="rgba(0,0,0,.25)"/>
        <rect x="64" y="44" width="28" height="256" rx="6" fill="url(#gStone)"/>
        <rect x="308" y="44" width="28" height="256" rx="6" fill="url(#gStone)"/>
        <rect x="52" y="40" width="296" height="22" rx="7" fill="url(#gWood)"/>
        <g class="swing">
          <rect x="184" y="62" width="32" height="38" rx="6" fill="url(#gWood)"/>
          <path d="M152 230 C152 160 172 100 200 100 C228 100 248 160 248 230 L268 250 L132 250 Z" fill="url(#gGold)"/>
          <path d="M172 222 C172 170 182 126 196 114" stroke="#fff" stroke-opacity=".55" stroke-width="9" fill="none" stroke-linecap="round"/>
          <rect x="126" y="244" width="148" height="16" rx="8" fill="url(#gGold)" stroke="#9a6a14" stroke-width="2"/>
          <circle cx="200" cy="272" r="14" fill="url(#gDark)"/>
        </g>
        <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
          <path class="ondas" d="M112 170 Q96 205 112 240"/><path class="ondas" style="animation-delay:.5s" d="M96 150 Q70 205 96 262"/>
          <path class="ondas" d="M288 170 Q304 205 288 240"/><path class="ondas" style="animation-delay:.5s" d="M304 150 Q330 205 304 262"/>
        </g>
      </svg>
      <!-- 2. Alhóndiga de Granaditas -->
      <svg class="art" viewBox="0 0 400 320" data-i="1">
        <ellipse cx="205" cy="300" rx="160" ry="12" fill="rgba(0,0,0,.25)"/>
        <g fill="url(#gStone)" stroke="#7a6e5c" stroke-width="2">
          <rect x="70" y="96" width="40" height="30" rx="3"/><rect x="125" y="96" width="40" height="30" rx="3"/><rect x="180" y="96" width="40" height="30" rx="3"/><rect x="235" y="96" width="40" height="30" rx="3"/><rect x="290" y="96" width="40" height="30" rx="3"/>
          <rect x="70" y="120" width="260" height="176" rx="4"/>
        </g>
        <rect x="62" y="120" width="276" height="14" rx="5" fill="#8a7d6a"/>
        <path d="M168 296 V228 A32 32 0 0 1 232 228 V296 Z" fill="url(#gDark)"/>
        <g fill="url(#gDark)"><rect x="98" y="160" width="28" height="44" rx="14"/><rect x="274" y="160" width="28" height="44" rx="14"/><circle cx="200" cy="172" r="17"/></g>
        <circle cx="42" cy="172" r="56" fill="url(#gGlow)"/>
        <g transform="rotate(-10 40 296)">
          <rect x="32" y="192" width="16" height="104" rx="6" fill="url(#gWood)"/>
          <g class="flicker">
            <path d="M40 198 C14 170 36 150 38 124 C50 148 72 160 62 184 C58 193 48 200 40 198 Z" fill="url(#gRed)"/>
            <path d="M40 192 C28 176 38 164 40 150 C48 164 54 174 48 184 Z" fill="#ffe58f"/>
          </g>
        </g>
      </svg>
      <!-- 3. Muerte de Hidalgo: vela -->
      <svg class="art" viewBox="0 0 400 320" data-i="2">
        <circle cx="200" cy="130" r="150" fill="url(#gGlow)"/>
        <g fill="#fff"><circle cx="60" cy="52" r="3"/><circle cx="338" cy="80" r="4"/><circle cx="92" cy="220" r="3"/><circle cx="326" cy="236" r="3"/><circle cx="300" cy="34" r="2.5"/></g>
        <ellipse cx="200" cy="296" rx="110" ry="16" fill="rgba(0,0,0,.35)"/>
        <ellipse cx="200" cy="286" rx="104" ry="17" fill="url(#gGold)"/>
        <rect x="164" y="150" width="72" height="136" rx="8" fill="url(#gPaper)"/>
        <rect x="216" y="150" width="20" height="136" rx="6" fill="#000" opacity=".1"/>
        <ellipse cx="200" cy="152" rx="36" ry="9" fill="#fff"/>
        <rect x="198" y="126" width="4" height="26" rx="2" fill="#333"/>
        <g class="flicker">
          <path d="M200 60 C168 104 174 132 200 138 C226 132 232 104 200 60 Z" fill="#ffb52e"/>
          <path d="M200 96 C188 114 190 130 200 132 C210 130 212 114 200 96 Z" fill="#fff4c4"/>
        </g>
      </svg>
      <!-- 4. Sitio de Cuautla: cañón -->
      <svg class="art" viewBox="0 0 400 320" data-i="3">
        <ellipse cx="205" cy="302" rx="150" ry="11" fill="rgba(0,0,0,.28)"/>
        <g class="recoil">
          <g transform="rotate(-16 210 200)">
            <rect x="104" y="170" width="24" height="64" rx="8" fill="#2b2f32"/>
            <rect x="110" y="176" width="190" height="52" rx="16" fill="url(#gDark)"/>
            <rect x="284" y="168" width="30" height="68" rx="9" fill="#2b2f32"/>
            <ellipse cx="312" cy="202" rx="6" ry="18" fill="#000"/>
            <rect x="132" y="181" width="150" height="8" rx="4" fill="#fff" opacity=".2"/>
          </g>
          <path d="M130 234 L292 234 L272 264 L150 264 Z" fill="url(#gWood)"/>
          <circle cx="210" cy="252" r="45" fill="none" stroke="url(#gWood)" stroke-width="12"/>
          <circle cx="210" cy="252" r="45" fill="none" stroke="#3a2410" stroke-width="2"/>
          <g stroke="#6a3d14" stroke-width="6" stroke-linecap="round"><path d="M210 208V296M166 252H254M179 221L241 283M241 221L179 283"/></g>
          <circle cx="210" cy="252" r="11" fill="#3a2410"/>
        </g>
        <g fill="#fff" fill-opacity=".92">
          <circle class="puff" cx="322" cy="164" r="18"/><circle class="puff" style="animation-delay:.15s" cx="346" cy="142" r="25"/><circle class="puff" style="animation-delay:.3s" cx="332" cy="178" r="20"/>
        </g>
      </svg>
      <!-- 5. Congreso de Chilpancingo: documento -->
      <svg class="art" viewBox="0 0 400 320" data-i="4">
        <ellipse cx="200" cy="304" rx="130" ry="10" fill="rgba(0,0,0,.25)"/>
        <g class="bob">
          <rect x="98" y="76" width="204" height="190" fill="url(#gPaper)" stroke="#c9b88a" stroke-width="2"/>
          <rect x="84" y="60" width="232" height="30" rx="15" fill="url(#gPaper)" stroke="#b79f66" stroke-width="2"/>
          <rect x="84" y="252" width="232" height="30" rx="15" fill="url(#gPaper)" stroke="#b79f66" stroke-width="2"/>
          <ellipse cx="92" cy="75" rx="8" ry="13" fill="#c9b070"/><ellipse cx="308" cy="75" rx="8" ry="13" fill="#c9b070"/>
          <ellipse cx="92" cy="267" rx="8" ry="13" fill="#c9b070"/><ellipse cx="308" cy="267" rx="8" ry="13" fill="#c9b070"/>
          <rect x="146" y="104" width="108" height="14" rx="4" fill="#c8102e"/>
          <g fill="#9b8f78" fill-opacity=".6"><rect x="124" y="136" width="152" height="9" rx="4"/><rect x="124" y="154" width="152" height="9" rx="4"/><rect x="124" y="172" width="122" height="9" rx="4"/><rect x="124" y="190" width="152" height="9" rx="4"/><rect x="124" y="208" width="92" height="9" rx="4"/></g>
          <path d="M252 236 L244 276 L258 268 L264 238Z" fill="url(#gRed)"/><path d="M276 236 L284 276 L270 268 L264 238Z" fill="url(#gRed)"/>
          <circle cx="264" cy="228" r="22" fill="url(#gRed)"/>
          <polygon points="264,216 267.5,224.5 276.5,225 269.5,231 272,240 264,235 256,240 258.5,231 251.5,225 260.5,224.5" fill="#ffe58f"/>
        </g>
      </svg>
      <!-- 6. Lucha en las montañas -->
      <svg class="art" viewBox="0 0 400 320" data-i="5">
        <circle class="bob" cx="200" cy="150" r="72" fill="url(#gGold)"/>
        <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M60 70 q8 -8 16 0 q8 -8 16 0"/><path d="M300 52 q7 -7 14 0 q7 -7 14 0"/></g>
        <polygon points="0,240 70,150 130,215 200,140 280,225 340,160 400,235 400,320 0,320" fill="url(#gGreen)"/>
        <polygon points="0,282 90,204 170,270 250,196 330,266 400,216 400,320 0,320" fill="#145a47"/>
        <polygon points="0,320 0,288 120,264 240,290 400,260 400,320" fill="#0b3a2e"/>
        <path d="M70 312 Q150 286 230 302 T390 288" fill="none" stroke="#f2b42d" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
        <rect x="248" y="150" width="5" height="50" fill="url(#gWood)"/>
        <path class="wave" d="M253 150 L292 160 L253 172 Z" fill="url(#gRed)"/>
      </svg>
      <!-- 7. Plan de Iguala: bandera trigarante -->
      <svg class="art" viewBox="0 0 400 320" data-i="6">
        <defs><clipPath id="cp7"><rect x="88" y="46" width="270" height="176" rx="4"/></clipPath></defs>

    <button class="btn" id="next" type="button"><span id="nextTxt">Siguiente</span> <span class="fl" id="nextFl">▶</span></button>
  </footer>
</div>
<script>
const M=[
 {fecha:"16 de septiembre de 1810",corto:"16 sep",anio:"1810",titulo:"El Grito de Dolores",
  que:"Hidalgo toca la campana de Dolores y llama al pueblo a levantarse en armas.",
  quienes:"Miguel Hidalgo e Ignacio Allende; la Corregidora, Josefa Ortiz, avisó que los habían descubierto.",c1:"#fff0b8",c2:"#f2b42d"},
 {fecha:"28 de septiembre de 1810",corto:"28 sep",anio:"1810",titulo:"Toma de la Alhóndiga",
  que:"Los insurgentes toman la Alhóndiga de Granaditas, en Guanajuato, donde se refugiaban los realistas.",
  quienes:"Hidalgo, Allende y, según la tradición, el Pípila, que incendió la puerta.",c1:"#ffe3cf",c2:"#d9774a"},
 {fecha:"30 de julio de 1811",corto:"30 jul",anio:"1811",titulo:"Muere Hidalgo",
  que:"Hidalgo es fusilado en Chihuahua después de ser capturado por los realistas.",
  quienes:"Antes fueron ejecutados Allende, Aldama y Jiménez; Morelos continúa la lucha.",c1:"#5d6ea3",c2:"#1b2147"},
 {fecha:"Febrero a mayo de 1812",corto:"Feb–May",anio:"1812",titulo:"Sitio de Cuautla",
  que:"Morelos resiste más de dos meses el cerco del ejército realista en Cuautla.",
  quienes:"José María Morelos, Hermenegildo Galeana y Mariano Matamoros contra el general Calleja.",c1:"#dcebf3",c2:"#7f9fb4"},
 {fecha:"14 de septiembre de 1813",corto:"14 sep",anio:"1813",titulo:"Congreso de Chilpancingo",
  que:"Se instala el primer congreso y se leen los Sentimientos de la Nación, ideas para un país libre.",
  quienes:"José María Morelos y los diputados del Congreso de Anáhuac.",c1:"#fff3c9",c2:"#d9a441"},
 {fecha:"De 1815 a 1820",corto:"1815–20",anio:"Guerrillas",titulo:"La lucha en las montañas",
  que:"Tras la muerte de Morelos, pocos grupos resisten con guerra de guerrillas en el sur y en Veracruz.",
  quienes:"Vicente Guerrero en las montañas del sur y Guadalupe Victoria en Veracruz.",c1:"#ffd9aa",c2:"#e58a4f"},
 {fecha:"24 de febrero de 1821",corto:"24 feb",anio:"1821",titulo:"Plan de Iguala",
  que:"Se proclama un plan con tres garantías y nace el Ejército Trigarante.",
  quienes:"Agustín de Iturbide y Vicente Guerrero se unen para lograr la Independencia.",c1:"#c9eddf",c2:"#3d9a78"},
 {fecha:"24 de agosto de 1821",corto:"24 ago",anio:"1821",titulo:"Tratados de Córdoba",
  que:"En Córdoba, Veracruz, se firma que la Nueva España será un país independiente.",
  quienes:"Agustín de Iturbide y Juan O'Donojú, el representante de España.",c1:"#e9e1f4",c2:"#8c7bb0"},
 {fecha:"27 de septiembre de 1821",corto:"27 sep",anio:"1821",titulo:"Entra el Ejército Trigarante",
  que:"El ejército entra a la Ciudad de México y se consuma la Independencia tras once años de lucha.",
  quienes:"Agustín de Iturbide al mando del Ejército Trigarante, recibido por el pueblo.",c1:"#2a3a85",c2:"#0b1033"}
];
const $=id=>document.getElementById(id);
const arts=[...document.querySelectorAll('.art')], N=M.length;
const artCard=$('artCard'), textCard=$('textCard');
let i=0, tk=0, mostrado=-1;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

M.forEach((m,k)=>{
  const b=document.createElement('button');
  b.className='node'; b.type='button'; b.dataset.i=k;
  b.setAttribute('aria-label',`${m.titulo}, ${m.fecha}`);
  b.innerHTML=`<span class="dot"></span><span class="d">${m.corto}</span><span class="y">${m.anio}</span>`;
  b.addEventListener('click',()=>go(k));
  $('nodes').appendChild(b);
});
const nodes=[...document.querySelectorAll('.node')];

function pintarContenido(){
  const m=M[i]; mostrado=i;
  $('fecha').textContent=m.fecha; $('titulo').textContent=m.titulo;
  $('que').textContent=m.que; $('quienes').textContent=m.quienes;
  artCard.style.setProperty('--c1',m.c1); artCard.style.setProperty('--c2',m.c2);
  arts.forEach((a,k)=>a.classList.toggle('on',k===i));
}
function pintarControles(){
  nodes.forEach((n,k)=>{n.classList.toggle('activo',k===i);n.classList.toggle('pasado',k<i);n.setAttribute('aria-current',k===i?'step':'false')});
  $('fill').style.width=(i/(N-1)*100)+'%';
  $('contador').textContent=`Momento ${i+1} de ${N}`;
  $('prev').disabled=i===0;
  const fin=i===N-1;
  $('nextTxt').textContent=fin?'Volver al inicio':'Siguiente';
  $('nextFl').textContent=fin?'↺':'▶';
}
async function go(n){
  if(n<0||n>=N) return;
  if(n===i&&mostrado===i) return;
  const dir=n>i?1:-1; i=n; const t=++tk;
  pintarControles();
  const cards=[artCard,textCard];
  cards.forEach(c=>c.getAnimations().forEach(a=>a.cancel()));
  if(reduce){pintarContenido();return}
  try{
    await Promise.all(cards.map(c=>c.animate(
      [{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*70}px) scale(.96)`}],
      {duration:180,easing:'ease-in',fill:'forwards'}).finished));
  }catch(e){return}
  if(t!==tk) return;
  pintarContenido();
  cards.forEach(c=>c.getAnimations().forEach(a=>a.cancel()));
  cards.forEach((c,k)=>c.animate(
    [{opacity:0,transform:`translateX(${dir*90}px) rotate(${dir*2}deg) scale(.95)`},{opacity:1,transform:'none'}],
    {duration:520,delay:k*90,easing:'cubic-bezier(.2,.9,.25,1.08)',fill:'backwards'}));
}
$('prev').addEventListener('click',()=>go(i-1));
$('next').addEventListener('click',()=>go(i===N-1?0:i+1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i===N-1?0:i+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
});
pintarContenido(); pintarControles();
</script>
