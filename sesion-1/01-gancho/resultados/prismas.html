<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismas: del desarrollo plano al sólido</title>
<style>
  :root{
    --ink:#10203a; --muted:#475569; --bg:#e9eef6; --card:#ffffff; --accent:#1d4ed8; --line:#cbd5e1;
  }
  *{box-sizing:border-box}
  html{font-size:clamp(15px,min(2.7vh,1.7vw),32px)}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:1rem;
    color:var(--ink);background:var(--bg);
    height:100vh;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;gap:.5rem;padding:.55rem .8rem;
    -webkit-user-select:none;user-select:none;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:0 0 auto}
  header>div{min-width:0}
  h1{font-size:1.4rem;margin:0;line-height:1.1;letter-spacing:-.01em}
  #info{margin:.2rem 0 0;color:var(--muted);font-size:.95rem;line-height:1.25}
  #info b{color:var(--ink)}
  .btns{display:flex;gap:.45rem;flex-wrap:nowrap;flex:0 0 auto}

  button{
    font:inherit;font-weight:700;padding:.4em .85em;border-radius:.7em;
    border:.12em solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;
    transition:background .12s,color .12s,transform .05s;white-space:nowrap;
  }
  button:hover:not(:disabled){background:#e8efff}
  button:active:not(:disabled){transform:translateY(1px)}
  button[aria-pressed="true"]{background:var(--accent);color:#fff}
  button:disabled{opacity:.38;cursor:default}
  button.sec{border-color:#64748b;color:#334155}
  button:focus-visible{outline:.15em solid #f59e0b;outline-offset:.1em}

  main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .panel{
    background:var(--card);border-radius:1rem;box-shadow:0 .1rem .6rem rgba(16,32,58,.12);
    display:flex;flex-direction:column;min-height:0;min-width:0;padding:.45rem .7rem .5rem;
  }
  .panel h2{margin:0 0 .15rem;font-size:1.2rem;display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .panel h2 small{font-weight:400;color:var(--muted);font-size:.8em}
  .cv{position:relative;flex:1 1 auto;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #c3d{cursor:grab} #c3d.drag{cursor:grabbing}

  #legend{display:flex;align-items:center;gap:.35rem .45rem;flex-wrap:wrap;flex:0 0 auto}
    .chip{
    display:inline-flex;align-items:center;gap:.4em;padding:.15em .65em .15em .35em;border-radius:2em;
    background:#fff;border:.1em solid var(--line);font-weight:600;font-size:.88rem;cursor:default;
  }
  .chip i{width:1.1em;height:1.1em;border-radius:.3em;display:inline-block;border:.1em solid rgba(16,32,58,.55)}
  .chip.on{border-color:var(--ink);box-shadow:0 0 0 .12em var(--ink)}

  .controls{display:flex;align-items:center;gap:.6rem;flex:0 0 auto;
    background:#fff;border-radius:1rem;padding:.4rem .7rem;box-shadow:0 .1rem .6rem rgba(16,32,58,.12)}
  .controls .lbl{font-weight:700;white-space:nowrap}
  #pct{min-width:4.2ch;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .sl{flex:1 1 auto;display:flex;align-items:center;gap:.6rem;min-width:9rem;margin-right:.4rem}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2rem;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:.7rem;border-radius:1rem;background:linear-gradient(90deg,#bfd0f7,#1d4ed8)}
  input[type=range]::-moz-range-track{height:.7rem;border-radius:1rem;background:linear-gradient(90deg,#bfd0f7,#1d4ed8)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;border:.2rem solid var(--accent);margin-top:-.5rem;box-shadow:0 .1rem .3rem rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;border:.2rem solid var(--accent)}
  input[type=range]:focus-visible{outline:.15em solid #f59e0b;outline-offset:.1em}

  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    header{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Prismas: del desarrollo plano al sólido</h1>
    <p id="info"></p>
  </div>
  <nav class="btns" id="prismas" aria-label="Elegir prisma">
    <button data-n="3" aria-pressed="true">Triangular</button>
    <button data-n="4" aria-pressed="false">Rectangular</button>
    <button data-n="5" aria-pressed="false">Pentagonal</button>
    <button data-n="6" aria-pressed="false">Hexagonal</button>
  </nav>
</header>

<main>
  <section class="panel">
    <h2>Prisma en 3D <small>↻ arrástralo con el mouse para girarlo</small></h2>
    <div class="cv"><canvas id="c3d" aria-label="Prisma en tres dimensiones"></canvas></div>
  </section>
  <section class="panel">
    <h2>Desarrollo plano <small>mismo color = misma cara</small></h2>
    <div class="cv"><canvas id="c2d" aria-label="Desarrollo plano del prisma"></canvas></div>
  </section>
</main>

<div id="legend"></div>

<div class="controls">
  <button id="bDesdoblar">▶ Desdoblar</button>
  <button id="bArmar">◀ Armar</button>
  <button id="bPausa" class="sec">‖ Pausa</button>
  <div class="sl">
    <span class="lbl">Armado</span>
    <input type="range" id="slider" min="0" max="100" value="100" aria-label="Qué tan armado está el prisma">
    <span id="pct">100%</span>
  </div>
  <button id="bVista" class="sec">⟲ Restablecer vista</button>
</div>

<script>
/*MODEL-START*/
const TAU = Math.PI * 2;

// Cada prisma: anchos de las caras laterales (= lados de la base) y altura.
const PRISMAS = {
  3: { nombre: 'triangular',  baseAdj: 'triangulares',  w: [2, 2, 2],             H: 3   },
  4: { nombre: 'rectangular', baseAdj: 'rectangulares', w: [3, 2, 3, 2],          H: 3.5 },
  5: { nombre: 'pentagonal',  baseAdj: 'pentagonales',  w: [2, 2, 2, 2, 2],       H: 3   },
  6: { nombre: 'hexagonal',   baseAdj: 'hexagonales',   w: [2, 2, 2, 2, 2, 2],    H: 3   }
};
const C_SUP = '#2F6FED', C_INF = '#F08C00';
const C_LAT = ['#E03131', '#2F9E44', '#F2C200', '#AE3EC9', '#15AABF', '#E64980'];

// Camina por los lados de un polígono girando 'turn' en cada vértice (+ izquierda, − derecha).
function walk(start, edges, turn) {
  let x = start[0], y = start[1], h = 0;
  const pts = [[x, y]];
  for (let i = 0; i < edges.length - 1; i++) {
    x += edges[i] * Math.cos(h); y += edges[i] * Math.sin(h);
    pts.push([x, y]); h += turn;
  }
  return pts;
}
function area2(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
function ccw(p) { return area2(p) >= 0 ? p : p.slice().reverse(); }
const ease = x => x * x * (3 - 2 * x);

// Desarrollo: tira de n rectángulos (caras laterales) + base inferior pegada a la cara 1
// + base superior pegada a otra cara. Todo se dobla "hacia atrás" (−z) para que
// el lado de color quede por fuera.
function buildModel(n) {
  const cfg = PRISMAS[n], w = cfg.w, H = cfg.H, T = TAU / n;
  const xs = [0]; for (let i = 0; i < n; i++) xs.push(xs[i] + w[i]);
  const hinges = [], faces = [];

  for (let i = 1; i < n; i++)
    hinges.push({ a: [xs[i], 0, 0], d: [0, 1, 0], ang: T, seg: [[xs[i], 0], [xs[i], H]] });
  const hb = hinges.length;
  hinges.push({ a: [0, 0, 0], d: [1, 0, 0], ang: Math.PI / 2, seg: [[0, 0], [w[0], 0]] });
  const kt = Math.floor(n / 2), ht = hinges.length;
  hinges.push({ a: [xs[kt], H, 0], d: [1, 0, 0], ang: -Math.PI / 2, seg: [[xs[kt], H], [xs[kt + 1], H]] });

  const wk = w.map((_, j) => w[(kt + j) % n]);
  faces.push({ id: 'sup', color: C_SUP, nombre: 'Base superior', etiquetas: ['Base superior', 'Base sup.', 'Sup.'],
    flat: ccw(walk([xs[kt], H], wk, T)), chain: [...Array(kt).keys(), ht] });
  faces.push({ id: 'inf', color: C_INF, nombre: 'Base inferior', etiquetas: ['Base inferior', 'Base inf.', 'Inf.'],
    flat: ccw(walk([0, 0], w, -T)), chain: [hb] });
  for (let i = 0; i < n; i++)
    faces.push({ id: 'l' + i, color: C_LAT[i], nombre: 'Lateral ' + (i + 1), etiquetas: ['Lateral ' + (i + 1), 'L' + (i + 1), '' + (i + 1)],
      flat: [[xs[i], 0], [xs[i + 1], 0], [xs[i + 1], H], [xs[i], H]], chain: [...Array(i).keys()] });
  return { n, cfg, faces, hinges };
}

// Posición 3D de cada vértice cuando el armado vale t (0 = plano, 1 = prisma).
// Los dobleces se hacen en cascada: uno tras otro.
function pose(model, t) {
  const hs = model.hinges, K = hs.length, cs = [], sn = [];
  for (let i = 0; i < K; i++) {
    const a = i * 0.5 / (K - 1);
    const u = ease(Math.min(1, Math.max(0, (t - a) / 0.5)));
    cs.push(Math.cos(u * hs[i].ang)); sn.push(Math.sin(u * hs[i].ang));
  }
  return model.faces.map(f => f.flat.map(([x, y]) => {
    let p = [x, y, 0];
    for (let j = f.chain.length - 1; j >= 0; j--) {
      const k = f.chain[j], h = hs[k], c = cs[k], s = sn[k], d = h.d;
      const v = [p[0] - h.a[0], p[1] - h.a[1], p[2] - h.a[2]];
      const dot = d[0] * v[0] + d[1] * v[1] + d[2] * v[2];
      const cr = [d[1] * v[2] - d[2] * v[1], d[2] * v[0] - d[0] * v[2], d[0] * v[1] - d[1] * v[0]];
      p = [h.a[0] + v[0] * c + cr[0] * s + d[0] * dot * (1 - c),
           h.a[1] + v[1] * c + cr[1] * s + d[1] * dot * (1 - c),
           h.a[2] + v[2] * c + cr[2] * s + d[2] * dot * (1 - c)];
    }
    return p;
  }));
}
/*MODEL-END*/

/* ====================== Interfaz ====================== */
const FONT = '"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
const INK = '#10203a';
const $ = s => document.querySelector(s);

const state = { n: 3, t: 1, yaw: -0.6, pitch: 0.38, hover: null };
const VISTA = { yaw: -0.6, pitch: 0.38 };
let model = buildModel(state.n);
let anim = null, dirty = true, dragging = false, last = null;

function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const css = c => `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
const lum = c => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
const textOn = c => lum(c) > 150 ? INK : '#ffffff';
const baseFont = () => parseFloat(getComputedStyle(document.body).fontSize);

/* ---- canvas con alta resolución ---- */
function makeCanvas(id) {
  const el = $(id), ctx = el.getContext('2d'), o = { el, ctx, w: 300, h: 300, hit: [] };
  const fit = () => {
    const r = el.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    o.w = Math.max(50, r.width); o.h = Math.max(50, r.height);
    el.width = Math.round(o.w * dpr); el.height = Math.round(o.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); dirty = true;
  };
  new ResizeObserver(fit).observe(el.parentElement); fit();
  return o;
}
const c3 = makeCanvas('#c3d'), c2 = makeCanvas('#c2d');

function pointInPoly(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function pathPoly(ctx, p) { ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }

// Escoge la etiqueta más larga que quepa en la cara.
function drawLabel(ctx, face, pts, fill, maxFontPx) {
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, cx = 0, cy = 0;
  for (const [x, y] of pts) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); cx += x; cy += y; }
  cx /= pts.length; cy /= pts.length;
  const lim = Math.min(maxx - minx, maxy - miny, Math.sqrt(Math.abs(area2(pts))) * 1.1) * 0.78;
  for (const txt of face.etiquetas) {
    for (let px = maxFontPx; px >= 12; px -= 1) {
      ctx.font = `700 ${px}px ${FONT}`;
      if (ctx.measureText(txt).width <= lim) {
        ctx.fillStyle = textOn(fill); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, cx, cy + px * 0.04); return;
      }
    }
  }
}

function faceFill(face, hovering, isHover, shade) {
  const base = hexRgb(face.color);
  let c = mix([0, 0, 0], base, shade);
  if (hovering && !isHover) c = mix(c, [226, 232, 240], 0.72);
  return c;
}

/* ---------------------- Vista 3D ---------------------- */
function draw3D() {
  const { ctx, w: W, h: Hh } = c3;
  ctx.clearRect(0, 0, W, Hh);
  const P = pose(model, state.t);
  const closed = state.t >= 0.9999;

  let cx = 0, cy = 0, cz = 0, cnt = 0;
  for (const f of P) for (const p of f) { cx += p[0]; cy += p[1]; cz += p[2]; cnt++; }
  cx /= cnt; cy /= cnt; cz /= cnt;
  let R = 0; for (const f of P) for (const p of f) R = Math.max(R, Math.hypot(p[0] - cx, p[1] - cy, p[2] - cz));

  const D = 6 * R, S = 0.48 * Math.min(W, Hh) / (R * D / (D - R));
  const ox = W / 2, oy = Hh / 2;
  const cyw = Math.cos(state.yaw), syw = Math.sin(state.yaw), cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const L = (() => { const v = [-0.35, 0.65, 0.68], m = Math.hypot(...v); return v.map(a => a / m); })();

  const list = [];
  model.faces.forEach((face, i) => {
    const v = P[i].map(p => {
      const x = p[0] - cx, y = p[1] - cy, z = p[2] - cz;
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
      return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
    });
    const sc = v.map(q => { const f = D / (D - q[2]); return [ox + S * q[0] * f, oy - S * q[1] * f, q[0] * f, q[1] * f]; });
    const ar = area2(sc.map(q => [q[2], q[3]]));          // >0: se ve el lado de color (por fuera)
    let mx = 0, my = 0, mz = 0; for (const q of v) { mx += q[0]; my += q[1]; mz += q[2]; }
    mx /= v.length; my /= v.length; mz /= v.length;
    const depth = Math.hypot(mx, my, mz - D);
    const a = v[0], b = v[1], c = v[2];
    let nx = (b[1] - a[1]) * (c[2] - a[2]) - (b[2] - a[2]) * (c[1] - a[1]);
    let ny = (b[2] - a[2]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[2] - a[2]);
    let nz = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const nm = Math.hypot(nx, ny, nz) || 1;
    const lam = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / nm);
    list.push({ face, pts: sc.map(q => [q[0], q[1]]), front: ar > 0, ar: Math.abs(ar) * S * S, depth, lam });
  });
  list.sort((p, q) => q.depth - p.depth);

  c3.hit = [];
  const hov = state.hover, fpx = baseFont() * 1.1;
  ctx.lineJoin = 'round';
  for (const it of list) {
    if (!it.front && closed) continue;
    if (it.ar < 0.05) continue;
    const isH = hov === it.face.id;
    let col;
    if (it.front) col = faceFill(it.face, !!hov, isH, 0.66 + 0.34 * it.lam);
    else col = faceFill(it.face, !!hov, isH, 0.5) , col = mix(col, [60, 70, 90], hov && !isH ? 0.1 : 0.35);
    pathPoly(ctx, it.pts);
    ctx.fillStyle = css(col); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = isH ? 5 : 2.5; ctx.stroke();
    if (it.front) drawLabel(ctx, it.face, it.pts, col, fpx);
    c3.hit.push({ id: it.face.id, pts: it.pts });
  }
}

/* -------------------- Desarrollo plano -------------------- */
function draw2D() {
  const { ctx, w: W, h: Hh } = c2;
  ctx.clearRect(0, 0, W, Hh);
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (const f of model.faces) for (const [x, y] of f.flat) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  const m = 14, S = Math.min((W - 2 * m) / (maxx - minx), (Hh - 2 * m) / (maxy - miny));
  const ox = W / 2 - S * (minx + maxx) / 2, oy = Hh / 2 + S * (miny + maxy) / 2;
  const tr = ([x, y]) => [ox + S * x, oy - S * y];

  c2.hit = [];
  const hov = state.hover, fpx = baseFont() * 1.15;
  ctx.lineJoin = 'round';
  const order = model.faces.slice().sort((a, b) => (a.id === hov) - (b.id === hov));
  for (const f of order) {
    const pts = f.flat.map(tr), isH = hov === f.id;
    const col = faceFill(f, !!hov, isH, 1);
    pathPoly(ctx, pts);
    ctx.fillStyle = css(col); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = isH ? 5 : 3; ctx.stroke();
    drawLabel(ctx, f, pts, col, fpx);
    c2.hit.push({ id: f.id, pts });
  }
  // dobleces punteados
  ctx.save(); ctx.setLineDash([9, 8]); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.4; ctx.lineCap = 'butt';
  for (const h of model.hinges) { const a = tr(h.seg[0]), b = tr(h.seg[1]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  ctx.restore();
}

/* ---------------------- Interacción ---------------------- */
function pick(o, e) {
  const r = o.el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (let i = o.hit.length - 1; i >= 0; i--) if (pointInPoly(x, y, o.hit[i].pts)) return o.hit[i].id;
  return null;
}
function setHover(id) {
  if (state.hover === id) return;
  state.hover = id; dirty = true;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.id === id));
}
c3.el.addEventListener('pointerdown', e => { dragging = true; last = [e.clientX, e.clientY]; c3.el.setPointerCapture(e.pointerId); c3.el.classList.add('drag'); });
c3.el.addEventListener('pointermove', e => {
  if (dragging) {
    state.yaw += (e.clientX - last[0]) * 0.008;
    state.pitch = Math.max(-1.55, Math.min(1.55, state.pitch + (e.clientY - last[1]) * 0.008));
    last = [e.clientX, e.clientY]; dirty = true;
  } else setHover(pick(c3, e));
});
const endDrag = () => { dragging = false; c3.el.classList.remove('drag'); };
c3.el.addEventListener('pointerup', endDrag); c3.el.addEventListener('pointercancel', endDrag);
c3.el.addEventListener('pointerleave', () => { if (!dragging) setHover(null); });
c2.el.addEventListener('pointermove', e => setHover(pick(c2, e)));
c2.el.addEventListener('pointerleave', () => setHover(null));

/* ---------------------- Animación ---------------------- */
function animateTo(target) {
  if (Math.abs(state.t - target) < 1e-4) return;
  anim = { from: state.t, to: target, t0: performance.now(), dur: 4600 * Math.abs(target - state.t) + 400 };
  syncUI();
}
function syncUI() {
  $('#slider').value = Math.round(state.t * 100);
  $('#pct').textContent = Math.round(state.t * 100) + '%';
  $('#bDesdoblar').disabled = state.t <= 0.0001 || (anim && anim.to === 0);
  $('#bArmar').disabled = state.t >= 0.9999 || (anim && anim.to === 1);
  $('#bPausa').disabled = !anim;
}
function tick() {
  if (anim) {
    const k = Math.min(1, Math.max(0, (performance.now() - anim.t0) / anim.dur));
    state.t = anim.from + (anim.to - anim.from) * k;
    if (k >= 1) { state.t = anim.to; anim = null; }
    syncUI(); dirty = true;
  }
  if (dirty) { dirty = false; draw3D(); draw2D(); }
  requestAnimationFrame(tick);
}
$('#bDesdoblar').onclick = () => animateTo(0);
$('#bArmar').onclick = () => animateTo(1);
$('#bPausa').onclick = () => { anim = null; syncUI(); };
$('#bVista').onclick = () => { state.yaw = VISTA.yaw; state.pitch = VISTA.pitch; dirty = true; };
$('#slider').addEventListener('input', e => { anim = null; state.t = e.target.value / 100; syncUI(); dirty = true; });

/* ---------------------- Elegir prisma ---------------------- */
function setPrisma(n) {
  state.n = n; model = buildModel(n); state.hover = null;
  document.querySelectorAll('#prismas button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
  const c = model.cfg;
  $('#info').innerHTML = `<b>Prisma ${c.nombre}</b> · ${n + 2} caras: 2 bases ${c.baseAdj} + ${n} caras laterales rectangulares · ${3 * n} aristas · ${2 * n} vértices`;
  const lg = $('#legend'); lg.innerHTML = '';
  for (const f of model.faces) {
    const s = document.createElement('span'); s.className = 'chip'; s.dataset.id = f.id;
    s.innerHTML = `<i style="background:${f.color}"></i>${f.nombre}`;
    s.addEventListener('pointerenter', () => setHover(f.id)); s.addEventListener('pointerleave', () => setHover(null));
    lg.appendChild(s);
  }
  dirty = true;
}
document.querySelectorAll('#prismas button').forEach(b => b.addEventListener('click', () => setPrisma(+b.dataset.n)));

setPrisma(3); syncUI();
requestAnimationFrame(tick);
</script>
